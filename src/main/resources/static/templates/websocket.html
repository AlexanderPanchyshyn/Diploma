<div class="container">
    <h2>Latency (WebSocket)</h2>

    <div class="controls-container">
        <button id="ws-connect">Connect</button>
        <button id="ws-disconnect" disabled>Disconnect</button>
        <button id="ws-ping" disabled>Send Ping</button>
    </div>

    <div class="metrics-container">
        <p><strong>Client Timestamp (Sent):</strong> <span id="ws-client-time">---</span></p>
        <p><strong>Server Timestamp (Received):</strong> <span id="ws-server-time">---</span></p>
        <p><strong>Latency (Difference):</strong> <span id="ws-latency">0</span> ms</p>
    </div>

    <div class="logs-header">
        <h3>Logs:</h3>
        <button id="ws-clear-logs" class="btn-clear">Clear Logs</button>
    </div>
    <div id="ws-log" class="log-container"></div>
</div>
